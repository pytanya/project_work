[project]
name = "edututor"
version = "0.1.0"
description = "EduTutor — образовательный агент-тьютор (MVP)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "rich",
    "python-dotenv",
    "openai>=1.0",
    "requests",
    "httpx",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite",
    "docling",
    "pdfplumber",
    "chromadb",
    "sentence-transformers",
    "qdrant-client",
    "easyocr",
    "crawl4ai",
    "playwright",
    "ddgs",
    "beautifulsoup4",
    "arize-phoenix",
    "openinference-instrumentation-openai",
    "fastapi",
    "uvicorn",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
pythonpath = ["."]
